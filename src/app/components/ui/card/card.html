<div class="block w-full bg-white border border-gray-200 rounded-2xl shadow-sm dark:bg-gray-800 dark:border-gray-700 overflow-hidden" [ngClass]="extraClasses">
  <!-- Cabecera de la tarjeta -->
  <div *ngIf="title || subtitle" class="border-b border-gray-100 dark:border-gray-700 px-5 py-4">
    <h5 *ngIf="title" class="text-lg font-bold tracking-tight text-gray-900 dark:text-white">{{ title }}</h5>
    <p *ngIf="subtitle" class="font-normal text-sm text-gray-500 dark:text-gray-400 mt-1">{{ subtitle }}</p>
  </div>
  
  <!-- Cuerpo de la tarjeta -->
  <div [ngClass]="{'p-5': !noPadding}">
    <ng-content></ng-content>
  </div>
</div>
