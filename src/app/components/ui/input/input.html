<div class="w-full relative">
  <label [for]="id" *ngIf="label" class="block mb-2 text-sm font-bold text-gray-900 dark:text-white" [ngClass]="{'text-red-700 dark:text-red-500': error}">
    {{ label }}
  </label>
  
  <div class="relative">
    <div *ngIf="hasIcon" class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-gray-500 dark:text-gray-400">
      <ng-content select="[icon]"></ng-content>
    </div>
    
    <input 
      [type]="type" 
      [id]="id"
      [disabled]="disabled"
      [value]="value"
      [attr.maxlength]="maxLength || null"
      (input)="onInput($event)"
      (blur)="onTouched()"
      [placeholder]="placeholder"
      class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-xl focus:ring-brand focus:border-brand block w-full p-3 font-medium transition-colors"
      [ngClass]="{
        'pl-10': hasIcon,
        'bg-gray-200 cursor-not-allowed opacity-70': disabled,
        'border-red-500 text-red-900 placeholder-red-700 focus:ring-red-500 focus:border-red-500': error
      }"
    >
  </div>
  
  <p *ngIf="error" class="mt-2 text-sm text-red-600 dark:text-red-500"><span class="font-medium">Oops!</span> {{ error }}</p>
</div>
