<ng-container *ngIf="!isLoginPage">
<div class="h-[100dvh] flex flex-col bg-gray-50 dark:bg-gray-900 pb-16 relative font-sans">
  
  <!-- Top App Bar -->
  <header class="bg-brand text-white p-4 shadow-md flex justify-between items-center shrink-0">
    <div class="flex items-center gap-2">
      <img src="/Group%208.svg" class="w-8 h-8 drop-shadow bg-white rounded-full p-1" alt="Logo">
      <h1 class="text-xl font-bold tracking-tight">Distribuidora</h1>
    </div>
    <button (click)="onLogout()" type="button" title="Cerrar Sesión" class="text-white hover:bg-red-700 focus:ring-4 focus:outline-none focus:ring-red-300 rounded-full p-2 transition-colors">
      <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M3 3a1 1 0 00-1 1v12a1 1 0 102 0V4a1 1 0 00-1-1zm10.293 9.293a1 1 0 001.414 1.414l3-3a1 1 0 000-1.414l-3-3a1 1 0 10-1.414 1.414L14.586 9H7a1 1 0 100 2h7.586l-1.293 1.293z" clip-rule="evenodd"></path></svg>
    </button>
  </header>

  <!-- Main Content Area (Scrollable) -->
  <main class="flex-1 overflow-y-auto w-full relative">
    <router-outlet></router-outlet>
  </main>

  <!-- Flowbite Bottom Navigation -->
  <div class="fixed bottom-0 z-50 w-full h-16 bg-white border-t border-gray-200 dark:bg-gray-700 dark:border-gray-600 shadow-lg">
      <div class="grid h-full max-w-lg grid-cols-4 mx-auto font-medium">
          <a routerLink="/dashboard" routerLinkActive="text-brand dark:text-brand-light border-t-2 border-brand" [routerLinkActiveOptions]="{exact: true}" class="inline-flex flex-col items-center justify-center px-5 hover:bg-gray-50 dark:hover:bg-gray-800 group text-gray-500 dark:text-gray-400">
              <svg class="w-6 h-6 mb-1 group-hover:text-brand dark:group-hover:text-brand-light transition-colors" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24">
                  <path fill-rule="evenodd" d="M11.293 3.293a1 1 0 0 1 1.414 0l6 6 2 2a1 1 0 0 1-1.414 1.414L19 12.414V19a2 2 0 0 1-2 2h-3a1 1 0 0 1-1-1v-3h-2v3a1 1 0 0 1-1 1H7a2 2 0 0 1-2-2v-6.586l-.293.293a1 1 0 0 1-1.414-1.414l2-2 6-6Z" clip-rule="evenodd"/>
              </svg>
              <span class="text-xs">Inicio</span>
          </a>
          <a routerLink="/mi-cartera" routerLinkActive="text-brand dark:text-brand-light border-t-2 border-brand" class="inline-flex flex-col items-center justify-center px-5 hover:bg-gray-50 dark:hover:bg-gray-800 group text-gray-500 dark:text-gray-400">
              <svg class="w-6 h-6 mb-1 group-hover:text-brand dark:group-hover:text-brand-light transition-colors" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24">
                  <path fill-rule="evenodd" d="M12 4a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm-2 9a4 4 0 0 0-4 4v1a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-1a4 4 0 0 0-4-4h-4Z" clip-rule="evenodd"/>
              </svg>
              <span class="text-xs">Cartera</span>
          </a>
          <a routerLink="/transferencias" routerLinkActive="text-brand dark:text-brand-light border-t-2 border-brand" class="inline-flex flex-col items-center justify-center px-5 hover:bg-gray-50 dark:hover:bg-gray-800 group text-gray-500 dark:text-gray-400">
              <svg class="w-6 h-6 mb-1 group-hover:text-brand dark:group-hover:text-brand-light transition-colors" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M7.5 21 3 16.5m0 0L7.5 12M3 16.5h13.5m0-13.5L21 7.5m0 0L16.5 12M21 7.5H7.5" />
              </svg>
              <span class="text-xs">Trámites</span>
          </a>
          <a routerLink="/mis-pagos" routerLinkActive="text-brand dark:text-brand-light border-t-2 border-brand" class="inline-flex flex-col items-center justify-center px-5 hover:bg-gray-50 dark:hover:bg-gray-800 group text-gray-500 dark:text-gray-400">
              <svg class="w-6 h-6 mb-1 group-hover:text-brand dark:group-hover:text-brand-light transition-colors" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 18.75a60.07 60.07 0 0 1 15.797 2.101c.727.198 1.453-.342 1.453-1.096V18.75M3.75 4.5v.75A.75.75 0 0 1 3 6h-.75m0 0v-.375c0-.621.504-1.125 1.125-1.125H20.25M2.25 6v9m18-10.5v.75c0 .414.336.75.75.75h.75m-1.5-1.5h.375c.621 0 1.125.504 1.125 1.125v9.75c0 .621-.504 1.125-1.125 1.125h-.375m1.5-1.5H21a.75.75 0 0 0-.75.75v.75m0 0H3.75m0 0h-.375a1.125 1.125 0 0 1-1.125-1.125V15m1.5 1.5v-.75A.75.75 0 0 0 3 15h-.75M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
              </svg>
              <span class="text-xs">Pagos</span>
          </a>
      </div>
  </div>
</div>
</ng-container>

<ng-container *ngIf="isLoginPage">
  <router-outlet></router-outlet>
</ng-container>
