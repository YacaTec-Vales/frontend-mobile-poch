<div class="p-4 pt-6 space-y-5 pb-24 font-sans">
  
  <!-- Encabezado / Alerta -->
  <div class="flex items-center justify-between">
    <div>
      <h2 class="text-2xl font-bold text-gray-900 dark:text-white">Hola, Distribuidora</h2>
      <p class="text-sm text-gray-500">Resumen de tu cuenta</p>
    </div>
    <div class="bg-brand-50 text-brand text-xs font-bold px-3 py-1 rounded-full border border-brand-200">
      Categoría Plata
    </div>
  </div>

  <!-- Status Financiero (Card Reutilizable) -->
  <app-card title="Status Financiero" subtitle="Tu línea de crédito" extraClasses="border-l-4 border-l-brand">
    <div class="grid grid-cols-2 gap-4 text-center mt-2">
      <div class="p-3 bg-gray-50 rounded-xl border border-gray-100">
        <p class="text-xs text-gray-500 uppercase tracking-wide font-bold mb-1">Límite Total</p>
        <p class="text-xl font-bold text-gray-900">$20,000</p>
      </div>
      <div class="p-3 bg-green-50 rounded-xl border border-green-100">
        <p class="text-xs text-green-700 uppercase tracking-wide font-bold mb-1">Disponible</p>
        <p class="text-xl font-bold text-green-700">$4,600</p>
      </div>
    </div>
  </app-card>

  <!-- Chart Card -->
  <app-card title="Uso de Crédito">
    <!-- Pie Chart -->
    <div class="py-2" id="donut-chart"></div>
  </app-card>

  <!-- Historial e Incentivos -->
  <app-card title="Historial e Incentivos" subtitle="Progreso para subir de categoría">
    <ul class="space-y-3 mb-5 mt-2">
      <li class="flex justify-between items-center text-sm border-b border-gray-100 pb-3">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-full bg-green-100 flex items-center justify-center text-green-600">
            <svg class="w-4 h-4" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
            </svg>
          </div>
          <div>
            <p class="font-bold text-gray-900">Vale #9823</p>
            <p class="text-xs text-gray-500">Liquidado el 12 Oct</p>
          </div>
        </div>
        <span class="text-green-600 font-bold">$2,000</span>
      </li>
      <li class="flex justify-between items-center text-sm border-b border-gray-100 pb-3">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-full bg-green-100 flex items-center justify-center text-green-600">
            <svg class="w-4 h-4" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
            </svg>
          </div>
          <div>
            <p class="font-bold text-gray-900">Vale #8721</p>
            <p class="text-xs text-gray-500">Liquidado el 01 Oct</p>
          </div>
        </div>
        <span class="text-green-600 font-bold">$1,500</span>
      </li>
    </ul>
    
    <app-button variant="outline" size="md" [fullWidth]="true">
      Solicitar Aumento de Crédito
    </app-button>
  </app-card>

  <!-- Quick Actions Panel -->
  <h5 class="text-lg font-bold text-gray-900 dark:text-white pt-2">Accesos Rápidos</h5>
  <div class="grid grid-cols-2 gap-4">
    <a routerLink="/vale-digital" class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 flex flex-col items-center justify-center gap-3 text-brand hover:bg-gray-50 dark:bg-gray-800 dark:text-brand-light dark:hover:bg-gray-700 transition-transform active:scale-95">
      <div class="bg-brand-50 p-3 rounded-full">
        <svg class="w-6 h-6 text-brand" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v12m-3-2.818l.879.659c1.171.879 3.07.879 4.242 0 1.172-.879 1.172-2.303 0-3.182C13.536 12.219 12.768 12 12 12c-.725 0-1.45-.22-2.003-.659-1.106-.879-1.106-2.303 0-3.182s2.9-.879 4.006 0l.415.33M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </div>
      <span class="font-bold text-sm text-gray-800">Dar Vale</span>
    </a>
    <a routerLink="/mi-cartera" class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 flex flex-col items-center justify-center gap-3 text-brand hover:bg-gray-50 dark:bg-gray-800 dark:text-brand-light dark:hover:bg-gray-700 transition-transform active:scale-95">
      <div class="bg-brand-50 p-3 rounded-full">
        <svg class="w-6 h-6 text-brand" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 0 1 8.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0 1 11.964-3.07M12 6.375a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0Zm8.25 2.25a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0Z" />
        </svg>
      </div>
      <span class="font-bold text-sm text-gray-800">Clientes</span>
    </a>
  </div>

  <!-- FAB for New Client -->
  <div class="fixed end-6 bottom-20 group z-50">
      <button type="button" routerLink="/nuevo-cliente" class="flex items-center justify-center text-brand bg-white border border-gray-200 rounded-full w-14 h-14 hover:bg-gray-50 focus:ring-4 focus:ring-gray-200 focus:outline-none shadow-xl transition-transform hover:scale-105 active:scale-95">
          <svg class="w-6 h-6 transition-transform group-hover:rotate-45" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 18 18">
              <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 1v16M1 9h16"/>
          </svg>
          <span class="sr-only">Nuevo Cliente</span>
      </button>
  </div>
</div>
