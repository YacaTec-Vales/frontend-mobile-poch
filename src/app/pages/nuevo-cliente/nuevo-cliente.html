<div class="p-4 space-y-6 pb-24 font-sans">
  <div class="flex items-center justify-between mb-2">
    <h2 class="text-2xl font-bold text-gray-900 dark:text-white">Nuevo Pre-vale</h2>
    <a routerLink="/dashboard" class="text-sm font-bold text-brand hover:underline">Cancelar</a>
  </div>

  <!-- Stepper -->
  <ol class="flex items-center w-full text-sm font-bold text-center text-gray-500 sm:text-base">
      <li class="flex md:w-full items-center text-brand sm:after:content-[''] after:w-full after:h-1 after:border-b after:border-gray-200 after:border-1 after:hidden sm:after:inline-block after:mx-6">
          <span class="flex items-center after:content-['/'] sm:after:hidden after:mx-2 after:text-gray-200">
              <svg class="w-4 h-4 me-2.5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 20">
                  <path d="M10 .5a9.5 9.5 0 1 0 9.5 9.5A9.51 9.51 0 0 0 10 .5Zm3.707 8.207-4 4a1 1 0 0 1-1.414 0l-2-2a1 1 0 0 1 1.414-1.414L9 10.586l3.293-3.293a1 1 0 0 1 1.414 1.414Z"/>
              </svg>
              Personal
          </span>
      </li>
      <li class="flex md:w-full items-center after:content-[''] after:w-full after:h-1 after:border-b after:border-gray-200 after:border-1 after:hidden sm:after:inline-block after:mx-6">
          <span class="flex items-center after:content-['/'] sm:after:hidden after:mx-2 after:text-gray-200">
              <span class="me-2">2</span>
              Fotos
          </span>
      </li>
      <li class="flex items-center">
          <span class="me-2">3</span>
          Resumen
      </li>
  </ol>

  <!-- Form Content -->
  <app-card [noPadding]="false">
    <form class="space-y-5">
      
      <app-input 
        label="Nombre Completo" 
        placeholder="Ej. Juan Pérez" 
        [(ngModel)]="nombre" 
        name="nombre">
      </app-input>
      
      <app-input 
        label="CURP (Validador Automático)" 
        placeholder="Ej. ABCD12345678901234" 
        [(ngModel)]="curp" 
        name="curp"
        [hasIcon]="true">
        <svg icon class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-4 0V5a2 2 0 114 0v1m-4 0a2 2 0 104 0m-5 8a2 2 0 100-4 2 2 0 000 4zm0 0c1.306 0 2.417.835 2.83 2M9 14a3.001 3.001 0 00-2.83 2M15 11h3m-3 4h2" />
        </svg>
      </app-input>

      <!-- Dropzone for INE (Step 2 Preview) -->
      <div class="pt-2 border-t border-gray-100">
        <label class="block mb-2 text-sm font-bold text-gray-900">Fotografía de INE (Frente y Reverso)</label>
        <div class="flex items-center justify-center w-full">
            <label for="dropzone-file" class="flex flex-col items-center justify-center w-full h-32 border-2 border-brand border-dashed rounded-xl cursor-pointer bg-brand-50 hover:bg-brand-100 transition-colors">
                <div class="flex flex-col items-center justify-center pt-5 pb-6 text-brand">
                    <svg class="w-8 h-8 mb-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 16">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 13h3a3 3 0 0 0 0-6h-.025A5.56 5.56 0 0 0 16 6.5 5.5 5.5 0 0 0 5.207 5.021C5.137 5.017 5.071 5 5 5a4 4 0 0 0 0 8h2.167M10 15V6m0 0L8 8m2-2 2 2"/>
                    </svg>
                    <p class="mb-2 text-sm font-bold"><span class="font-extrabold">Click para capturar</span> o galería</p>
                </div>
                <input id="dropzone-file" type="file" class="hidden" capture="environment" accept="image/*" />
            </label>
        </div> 
      </div>

      <div class="pt-2">
        <app-button variant="primary" size="lg" [fullWidth]="true">
          Siguiente Paso
        </app-button>
      </div>
    </form>
  </app-card>
</div>
