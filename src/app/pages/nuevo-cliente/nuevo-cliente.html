<div class="p-4 space-y-6 pb-24">
  <div class="flex items-center justify-between mb-4">
    <h2 class="text-xl font-bold text-gray-900 dark:text-white">Nuevo Prevale</h2>
    <a routerLink="/dashboard" class="text-sm font-medium text-brand hover:underline dark:text-brand-light">Cancelar</a>
  </div>

  <!-- Stepper -->
  <ol class="flex items-center w-full text-sm font-medium text-center text-gray-500 dark:text-gray-400 sm:text-base">
      <li class="flex md:w-full items-center text-brand dark:text-brand-light sm:after:content-[''] after:w-full after:h-1 after:border-b after:border-gray-200 after:border-1 after:hidden sm:after:inline-block after:mx-6 xl:after:mx-10 dark:after:border-gray-700">
          <span class="flex items-center after:content-['/'] sm:after:hidden after:mx-2 after:text-gray-200 dark:after:text-gray-500">
              <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4 me-2.5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 20">
                  <path d="M10 .5a9.5 9.5 0 1 0 9.5 9.5A9.51 9.51 0 0 0 10 .5Zm3.707 8.207-4 4a1 1 0 0 1-1.414 0l-2-2a1 1 0 0 1 1.414-1.414L9 10.586l3.293-3.293a1 1 0 0 1 1.414 1.414Z"/>
              </svg>
              Personal
          </span>
      </li>
      <li class="flex md:w-full items-center after:content-[''] after:w-full after:h-1 after:border-b after:border-gray-200 after:border-1 after:hidden sm:after:inline-block after:mx-6 xl:after:mx-10 dark:after:border-gray-700">
          <span class="flex items-center after:content-['/'] sm:after:hidden after:mx-2 after:text-gray-200 dark:after:text-gray-500">
              <span class="me-2">2</span>
              Fotos
          </span>
      </li>
      <li class="flex items-center">
          <span class="me-2">3</span>
          Resumen
      </li>
  </ol>

  <!-- Form Content (Step 1 Simulado) -->
  <div class="bg-white rounded-xl shadow p-4 dark:bg-gray-800 border border-gray-100 dark:border-gray-700">
    <form class="space-y-4">
      <div>
        <label for="name" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Nombre Completo</label>
        <input type="text" id="name" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-brand focus:border-brand block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white" required>
      </div>
      <div>
        <label for="curp" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">CURP (Validador automático)</label>
        <input type="text" id="curp" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-brand focus:border-brand block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white" placeholder="Ej. ABCD12345678901234" required>
        <p class="mt-1 text-xs text-green-600 dark:text-green-400 hidden" id="curp-success">CURP Válido.</p>
      </div>

      <!-- Dropzone for INE (Step 2 Preview) -->
      <div class="pt-4 border-t border-gray-200 dark:border-gray-700 mt-4">
        <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Fotografía de INE (Frente y Reverso)</label>
        <div class="flex items-center justify-center w-full">
            <label for="dropzone-file" class="flex flex-col items-center justify-center w-full h-32 border-2 border-gray-300 border-dashed rounded-lg cursor-pointer bg-gray-50 dark:hover:bg-bray-800 dark:bg-gray-700 hover:bg-gray-100 dark:border-gray-600 dark:hover:border-gray-500 dark:hover:bg-gray-600">
                <div class="flex flex-col items-center justify-center pt-5 pb-6">
                    <svg class="w-8 h-8 mb-4 text-gray-500 dark:text-gray-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 16">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 13h3a3 3 0 0 0 0-6h-.025A5.56 5.56 0 0 0 16 6.5 5.5 5.5 0 0 0 5.207 5.021C5.137 5.017 5.071 5 5 5a4 4 0 0 0 0 8h2.167M10 15V6m0 0L8 8m2-2 2 2"/>
                    </svg>
                    <p class="mb-2 text-sm text-gray-500 dark:text-gray-400"><span class="font-semibold">Click para capturar</span> o galería</p>
                </div>
                <input id="dropzone-file" type="file" class="hidden" capture="environment" accept="image/*" />
            </label>
        </div> 
      </div>

      <button type="button" class="w-full text-white bg-brand hover:bg-brand-strong focus:ring-4 focus:ring-brand-300 font-medium rounded-lg text-sm px-5 py-2.5 mt-4 text-center dark:focus:ring-brand-800 transition-colors">
        Siguiente Paso
      </button>
    </form>
  </div>
</div>
