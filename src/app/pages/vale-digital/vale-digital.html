<div class="p-4 space-y-4 pb-24 font-sans">
  <div class="flex items-center justify-between mb-2">
    <h2 class="text-2xl font-bold text-gray-900 dark:text-white">Generar Vale</h2>
  </div>

  <!-- Search form -->
  <app-search-bar placeholder="Buscar por nombre o ID de cliente..."></app-search-bar>

  <!-- Client Profile Selected (Simulated) -->
  <app-card [noPadding]="false">
    <div class="flex items-center gap-4 mb-4">
        <div class="w-12 h-12 rounded-full bg-brand-100 flex items-center justify-center text-brand font-bold text-xl">MG</div>
        <div>
            <h3 class="text-lg font-bold text-gray-900 dark:text-white">María González Pérez</h3>
            <p class="text-sm text-gray-500 dark:text-gray-400 font-medium">Cliente Activo • ID: 8394</p>
        </div>
    </div>
    
    <div class="p-3 bg-brand-50 rounded-xl text-brand-900 mb-4 flex justify-between items-center border border-brand-100">
      <span class="text-sm font-bold">Límite total disponible:</span>
      <span class="text-lg font-black">${{ limiteDisponible | number:'1.2-2' }}</span>
    </div>

    <!-- Regla 50% Warning -->
    <div class="p-3 mb-4 text-sm text-yellow-800 rounded-lg bg-yellow-50 font-medium border border-yellow-200" role="alert">
      <span class="font-bold">Regla del 50%:</span> Al ser primer vale, el monto máximo permitido es ${{ limitePermitido | number:'1.2-2' }}.
    </div>

    <!-- Amount Selection -->
    <label class="block mb-3 text-sm font-bold text-gray-900 dark:text-white">Monto rápido</label>
    <div class="grid grid-cols-3 gap-3 mb-5">
      <app-button variant="outline" size="sm" (onClick)="monto = 500">$500</app-button>
      <app-button variant="primary" size="sm" (onClick)="monto = 1000">$1,000</app-button>
      <app-button variant="outline" size="sm" [disabled]="true" title="Supera el 50%">$2,500</app-button>
    </div>
    
    <div class="mb-6">
      <app-input 
        label="Monto Personalizado" 
        type="number" 
        [hasIcon]="true"
        [(ngModel)]="monto"
        [error]="monto > limitePermitido ? 'El monto supera el 50% permitido' : ''">
        <span icon class="font-bold text-gray-500">$</span>
      </app-input>
    </div>

    <app-button variant="primary" size="lg" [fullWidth]="true" [disabled]="monto > limitePermitido">
      Generar Folio
    </app-button>
  </app-card>
</div>
