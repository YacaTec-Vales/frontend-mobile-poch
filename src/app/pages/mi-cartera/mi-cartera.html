<div class="p-4 space-y-4 pb-24">
  <div class="flex items-center justify-between mb-2">
    <h2 class="text-xl font-bold text-gray-900 dark:text-white">Mi Cartera</h2>
    <span class="bg-gray-100 text-gray-800 text-xs font-medium px-2.5 py-0.5 rounded-full dark:bg-gray-700 dark:text-gray-300">14 Clientes</span>
  </div>

  <!-- Search -->
  <div class="relative mb-6">
      <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
          <svg class="w-4 h-4 text-gray-500 dark:text-gray-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 20">
              <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m19 19-4-4m0-7A7 7 0 1 1 1 8a7 7 0 0 1 14 0Z"/>
          </svg>
      </div>
      <input type="text" class="bg-white border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-brand focus:border-brand block w-full ps-10 p-2.5 dark:bg-gray-800 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white" placeholder="Filtrar clientes...">
  </div>

  <!-- List Group -->
  <ul class="max-w-md divide-y divide-gray-200 dark:divide-gray-700 bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700">
     
      <!-- Item 1 (Al corriente) -->
      <li class="p-4 sm:pb-4 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors first:rounded-t-xl">
         <div class="flex items-center space-x-4 rtl:space-x-reverse">
            <div class="flex-shrink-0">
               <img class="w-10 h-10 rounded-full" src="https://flowbite.com/docs/images/people/profile-picture-1.jpg" alt="Neil image">
            </div>
            <div class="flex-1 min-w-0">
               <p class="text-sm font-medium text-gray-900 truncate dark:text-white">
                  Neil Sims
               </p>
               <p class="text-sm text-gray-500 truncate dark:text-gray-400">
                  <span class="bg-green-100 text-green-800 text-xs font-medium me-2 px-2.5 py-0.5 rounded dark:bg-green-900 dark:text-green-300 border border-green-400">Al corriente</span>
               </p>
            </div>
            <div class="inline-flex items-center gap-2">
               <div class="text-base font-semibold text-gray-900 dark:text-white">
                  $320
               </div>
               <button type="button" class="text-gray-900 bg-white border border-gray-300 focus:outline-none hover:bg-gray-100 focus:ring-4 focus:ring-gray-100 font-medium rounded-lg text-xs px-2 py-1.5 dark:bg-gray-800 dark:text-white dark:border-gray-600 dark:hover:bg-gray-700 dark:hover:border-gray-600 dark:focus:ring-gray-700">
                Transferir
               </button>
            </div>
         </div>
      </li>

      <!-- Item 2 (Atrasado) -->
      <li class="p-4 sm:pb-4 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">
         <div class="flex items-center space-x-4 rtl:space-x-reverse">
            <div class="flex-shrink-0">
               <img class="w-10 h-10 rounded-full" src="https://flowbite.com/docs/images/people/profile-picture-3.jpg" alt="Bonnie image">
            </div>
            <div class="flex-1 min-w-0">
               <p class="text-sm font-medium text-gray-900 truncate dark:text-white">
                  Bonnie Green
               </p>
               <p class="text-sm text-gray-500 truncate dark:text-gray-400">
                  <span class="bg-red-100 text-red-800 text-xs font-medium me-2 px-2.5 py-0.5 rounded dark:bg-red-900 dark:text-red-300 border border-red-400">Atrasado (2 quincenas)</span>
               </p>
            </div>
            <div class="inline-flex items-center gap-2">
               <div class="text-base font-semibold text-red-600 dark:text-red-400">
                  $1,450
               </div>
               <button type="button" class="text-gray-900 bg-white border border-gray-300 focus:outline-none hover:bg-gray-100 focus:ring-4 focus:ring-gray-100 font-medium rounded-lg text-xs px-2 py-1.5 dark:bg-gray-800 dark:text-white dark:border-gray-600 dark:hover:bg-gray-700 dark:hover:border-gray-600 dark:focus:ring-gray-700">
                Transferir
               </button>
            </div>
         </div>
      </li>

      <!-- Item 3 -->
      <li class="p-4 sm:pb-4 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors last:rounded-b-xl">
         <div class="flex items-center space-x-4 rtl:space-x-reverse">
            <div class="flex-shrink-0">
               <img class="w-10 h-10 rounded-full" src="https://flowbite.com/docs/images/people/profile-picture-2.jpg" alt="Michael image">
            </div>
            <div class="flex-1 min-w-0">
               <p class="text-sm font-medium text-gray-900 truncate dark:text-white">
                  Michael Gough
               </p>
               <p class="text-sm text-gray-500 truncate dark:text-gray-400">
                  <span class="bg-green-100 text-green-800 text-xs font-medium me-2 px-2.5 py-0.5 rounded dark:bg-green-900 dark:text-green-300 border border-green-400">Al corriente</span>
               </p>
            </div>
            <div class="inline-flex items-center gap-2">
               <div class="text-base font-semibold text-gray-900 dark:text-white">
                  $67
               </div>
               <button type="button" class="text-gray-900 bg-white border border-gray-300 focus:outline-none hover:bg-gray-100 focus:ring-4 focus:ring-gray-100 font-medium rounded-lg text-xs px-2 py-1.5 dark:bg-gray-800 dark:text-white dark:border-gray-600 dark:hover:bg-gray-700 dark:hover:border-gray-600 dark:focus:ring-gray-700">
                Transferir
               </button>
            </div>
         </div>
      </li>
  </ul>
</div>
