<div class="p-4 space-y-4 pb-24 font-sans">
  <div class="flex items-center justify-between mb-2">
    <h2 class="text-2xl font-bold text-gray-900 dark:text-white">Mi Cartera</h2>
    <span class="bg-brand-50 text-brand border border-brand-200 text-xs font-bold px-3 py-1 rounded-full">14 Clientes</span>
  </div>

  <!-- Search -->
  <app-search-bar placeholder="Buscar por nombre o folio..." (onSearch)="onSearch($event)"></app-search-bar>

  <!-- List Group -->
  <app-card [noPadding]="true">
    <ul class="divide-y divide-gray-100 dark:divide-gray-700">
      
      <!-- Item 1 (Al corriente) -->
      <li class="p-4 hover:bg-gray-50 transition-colors cursor-pointer">
         <div class="flex items-center space-x-4">
            <div class="flex-shrink-0">
               <div class="w-12 h-12 rounded-full bg-gray-100 flex items-center justify-center text-gray-500 font-bold text-lg">NS</div>
            </div>
            <div class="flex-1 min-w-0">
               <p class="text-base font-bold text-gray-900 truncate">
                  Neil Sims
               </p>
               <p class="text-sm mt-1 text-gray-500">
                  <span class="bg-green-100 text-green-800 text-xs font-bold px-2 py-0.5 rounded border border-green-200">Al corriente</span>
               </p>
            </div>
            <div class="text-right">
               <div class="text-lg font-bold text-gray-900">
                  $320
               </div>
               <p class="text-xs text-gray-500 font-medium">Adeudo actual</p>
            </div>
         </div>
      </li>

      <!-- Item 2 (Atrasado - Bloqueado) -->
      <li class="p-4 bg-red-50 hover:bg-red-100 transition-colors">
         <div class="flex items-center space-x-4">
            <div class="flex-shrink-0 relative">
               <div class="w-12 h-12 rounded-full bg-red-100 flex items-center justify-center text-red-500 font-bold text-lg">BG</div>
               <div class="absolute -bottom-1 -right-1 w-5 h-5 bg-red-600 rounded-full flex items-center justify-center text-white border-2 border-white shadow-sm">
                 <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12" /></svg>
               </div>
            </div>
            <div class="flex-1 min-w-0">
               <p class="text-base font-bold text-red-900 truncate">
                  Bonnie Green
               </p>
               <p class="text-sm mt-1">
                  <span class="bg-red-200 text-red-900 text-xs font-bold px-2 py-0.5 rounded border border-red-300">Bloqueado por deuda</span>
               </p>
            </div>
            <div class="text-right">
               <div class="text-lg font-bold text-red-700">
                  $1,450
               </div>
               <p class="text-xs text-red-600 font-medium">Vencido</p>
            </div>
         </div>
      </li>
      
      <!-- Item 3 -->
      <li class="p-4 hover:bg-gray-50 transition-colors cursor-pointer">
         <div class="flex items-center space-x-4">
            <div class="flex-shrink-0">
               <div class="w-12 h-12 rounded-full bg-gray-100 flex items-center justify-center text-gray-500 font-bold text-lg">MG</div>
            </div>
            <div class="flex-1 min-w-0">
               <p class="text-base font-bold text-gray-900 truncate">
                  Michael Gough
               </p>
               <p class="text-sm mt-1">
                  <span class="bg-green-100 text-green-800 text-xs font-bold px-2 py-0.5 rounded border border-green-200">Al corriente</span>
               </p>
            </div>
            <div class="text-right">
               <div class="text-lg font-bold text-gray-900">
                  $0
               </div>
               <p class="text-xs text-gray-500 font-medium">Adeudo actual</p>
            </div>
         </div>
      </li>
    </ul>
  </app-card>
</div>
